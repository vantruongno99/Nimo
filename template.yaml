AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Nimo
Transform:
- AWS::Serverless-2016-10-31

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html


Parameters:
  SendGridApiKey:
    Type: String
    NoEcho: true
    Description: "SendGrid API Key passed at deploy time"


Resources:
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # Lambda for the first microservice:
  getCryptoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getCrypto.getCryptoHandler
      Runtime: nodejs22.x
      Environment:                      
       Variables:
        TABLE_NAME: !Ref CryptoSearchHistory
        SENDGRID_API_KEY: !Ref SendGridApiKey
      Policies:
       - DynamoDBCrudPolicy:
          TableName: !Ref CryptoSearchHistory
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: POST
  
  # Lambda for the second microservice:
  getHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getHistory.getHistoryHandler
      Runtime: nodejs22.x
      Environment:                      
       Variables:
        TABLE_NAME: !Ref CryptoSearchHistory
      Policies:
       - DynamoDBCrudPolicy:
          TableName: !Ref CryptoSearchHistory
      Events:
        Api:
          Type: Api
          Properties:
            Path: /history
            Method: GET
 
  # DynamoDB table to store history
  CryptoSearchHistory:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CryptoSearchHistory
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE  
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL for Prod stage
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON
